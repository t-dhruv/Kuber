name: Cleanup Pre-release Images

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Delete branch-* images older than N days"
        required: false
        default: "14"

jobs:
  cleanup:
    name: Delete stale branch images — ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package: [kuber-server, kuber-client]

    steps:
      # Delete untagged (dangling) image layers
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-only-untagged-versions: true

      # Delete branch-* tagged versions older than keep_days via GitHub API
      - name: Delete old branch-* versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
          KEEP_DAYS: ${{ inputs.keep_days || '14' }}
        run: |
          set -euo pipefail

          CUTOFF=$(date -d "-${KEEP_DAYS} days" +%s)
          PAGE=1
          DELETED=0

          echo "Deleting branch-* versions of ${PACKAGE} older than ${KEEP_DAYS} days..."

          while true; do
            VERSIONS=$(gh api \
              "/user/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}" \
              --jq '.[]')

            [ -z "$VERSIONS" ] && break

            while IFS= read -r VERSION; do
              VERSION_ID=$(echo "$VERSION" | jq -r '.id')
              UPDATED_AT=$(echo "$VERSION" | jq -r '.updated_at')
              TAGS=$(echo "$VERSION" | jq -r '.metadata.container.tags[]?' 2>/dev/null || true)

              # Only target branch-* tags
              if ! echo "$TAGS" | grep -q '^branch-'; then
                continue
              fi

              UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s)
              if [ "$UPDATED_EPOCH" -lt "$CUTOFF" ]; then
                echo "  Deleting version ${VERSION_ID} (tags: $(echo $TAGS | tr '\n' ',') updated: ${UPDATED_AT})"
                gh api --method DELETE \
                  "/user/packages/container/${PACKAGE}/versions/${VERSION_ID}" \
                  --silent || echo "  Warning: could not delete ${VERSION_ID}"
                DELETED=$((DELETED + 1))
              fi
            done <<< "$(gh api \
              "/user/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}" \
              --jq '.[]' | jq -c '.')"

            PAGE=$((PAGE + 1))
            # If we got fewer than 100 results this is the last page
            COUNT=$(gh api \
              "/user/packages/container/${PACKAGE}/versions?per_page=100&page=$((PAGE - 1))" \
              --jq 'length')
            [ "$COUNT" -lt 100 ] && break
          done

          echo "Done. Deleted ${DELETED} version(s)."

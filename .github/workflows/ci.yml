name: CI

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!main'
  pull_request:
    branches: ['**']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kuber

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (server)
        run: npx tsc --noEmit
        working-directory: server

      - name: Typecheck (client)
        run: npx tsc --noEmit
        working-directory: client

      - name: Unit tests (server)
        run: npm run test
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kuber:kuber_test@localhost:5432/kuber_test
          JWT_SECRET: test_jwt_secret_at_least_64_characters_long_for_ci_pipeline_run
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_64_characters_long_for_ci_pipeline

      # E2E tests require a running PostgreSQL + seeded data.
      # Skipped here — run locally with `npm run test:e2e` or add a service container.
      # See: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers

  build:
    name: Build (TypeScript + Vite)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  docker-preview:
    name: Build & Push Pre-release Image
    runs-on: ubuntu-latest
    needs: build
    # Only push Docker images on direct branch pushes, not on PRs
    # (PRs from forks don't have write access to GHCR)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute pre-release tags
        id: meta
        run: |
          # Sanitize branch name for use as a Docker tag (/ → -, remove disallowed chars)
          BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g' | tr -dc '[:alnum:]-_.')
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "SERVER_TAGS=${{ env.IMAGE_PREFIX }}-server:pr-${SAFE_BRANCH},${{ env.IMAGE_PREFIX }}-server:pr-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "CLIENT_TAGS=${{ env.IMAGE_PREFIX }}-client:pr-${SAFE_BRANCH},${{ env.IMAGE_PREFIX }}-client:pr-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BRANCH=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push server image (pre-release)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.SERVER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image (pre-release)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.CLIENT_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pre-release images published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ steps.meta.outputs.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`ghcr.io/${{ github.repository_owner }}/kuber-server:pr-${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Client:** \`ghcr.io/${{ github.repository_owner }}/kuber-client:pr-${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

      # E2E tests (Playwright) require a running PostgreSQL database and seeded
      # data. They are intentionally skipped in CI until a self-hosted runner or
      # a service container is configured.
      #
      # To enable, add a postgres service container and run:
      #   - run: npm run test:e2e
      #
      # See: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers

name: CI

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!main'
  pull_request:
    branches: ['**']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kuber

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

      # E2E tests (Playwright) require a running PostgreSQL database and seeded
      # data. They are intentionally skipped in CI until a self-hosted runner or
      # a service container is configured.
      #
      # To enable, add a postgres service container and run:
      #   - run: npm run test:e2e
      #
      # See: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers

  docker-preview:
    name: Build & Push Pre-release Image
    runs-on: ubuntu-latest
    # Only push Docker images on direct branch pushes, not on PRs
    # (PRs from forks don't have write access to GHCR)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute pre-release tags
        id: meta
        run: |
          # Sanitize branch name for use as a Docker tag (/ → -, remove disallowed chars)
          BRANCH="${GITHUB_REF#refs/heads/}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g' | tr -dc '[:alnum:]-_.')
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "SERVER_TAGS=${{ env.IMAGE_PREFIX }}-server:pr-${SAFE_BRANCH},${{ env.IMAGE_PREFIX }}-server:pr-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "CLIENT_TAGS=${{ env.IMAGE_PREFIX }}-client:pr-${SAFE_BRANCH},${{ env.IMAGE_PREFIX }}-client:pr-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BRANCH=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push server image (pre-release)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.SERVER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image (pre-release)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.CLIENT_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pre-release images published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ steps.meta.outputs.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`ghcr.io/${{ github.repository_owner }}/kuber-server:pr-${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Client:** \`ghcr.io/${{ github.repository_owner }}/kuber-client:pr-${{ steps.meta.outputs.BRANCH }}\`" >> $GITHUB_STEP_SUMMARY

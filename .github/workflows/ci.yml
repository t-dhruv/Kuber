name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing in this workflow touches a database. Prisma still resolves the
  # datasource block when it generates a client, so the URL has to parse.
  # Database-backed suites arrive with their own service container.
  DATABASE_URL: postgresql://kuber:kuber@localhost:5432/kuber_ci
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pin to the version declared in packageManager. npm 12 blocks package
      # install scripts by default, which leaves Prisma without its engines and
      # esbuild without its binary; the failure surfaces much later, as a build
      # error. Pinning keeps CI on the version the repository is built against
      # rather than whatever the runner's Node happens to bundle.
      - name: Pin npm
        run: npm i -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      # The server's types come from the generated Prisma client, so this has
      # to precede both typecheck and the tests.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

name: Release

# Tagging a version is the whole release procedure. Pushing `v1.2.3` runs the
# same gate a pull request runs, then builds and publishes both images and cuts
# a GitHub Release from the changelog. Nothing here is triggered by a branch
# push: `master` is proven by CI, and releases are proven by tags.
#
# The gate is a separate job that every publishing job depends on, so a red
# gate publishes nothing — no image, no tag, no Release.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Prisma resolves the datasource block when it generates a client, so the URL
  # has to parse even for the steps that never open a connection. The
  # database-backed suite overrides this with TEST_DATABASE_URL.
  DATABASE_URL: postgresql://kuber:kuber@localhost:5432/kuber_ci
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ─── Gate ───────────────────────────────────────────────────────────────────
  # Mirrors the pull-request gate in ci.yml, including the database-backed
  # suite. A release must clear at least the bar a pull request clears.
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuber
          POSTGRES_PASSWORD: kuber
          POSTGRES_DB: kuber_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuber"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Pin to the version declared in packageManager, for the reason spelled
      # out in ci.yml: npm 12 blocks install scripts, which leaves Prisma
      # without its engines and surfaces much later as a build error.
      - name: Pin npm
        run: npm i -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      # The tag is the source of truth for what gets published, so it must
      # agree with the version the images are built from. Catching the
      # mismatch here means a typo'd tag publishes nothing rather than
      # publishing images that misreport their own version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG, but package.json declares $PKG."
            exit 1
          fi
          echo "Releasing version $PKG"

      # The Release job reads its body out of the changelog, but it runs after
      # both images are published. Checking here means a missing entry costs a
      # failed gate rather than published images with no Release to explain
      # them. `scripts/release.sh` runs the same check before it tags.
      - name: Verify the changelog has an entry for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v want="## [$VERSION]" '
            index($0, want) == 1 { flag = 1; next }
            /^## \[/            { flag = 0 }
            flag                { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entry for [$VERSION]. Add one before tagging."
            exit 1
          fi

      # The server's types come from the generated Prisma client, so this has
      # to precede both typecheck and the tests.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Database-backed tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://kuber:kuber@localhost:5432/kuber_ci_test

      - name: Build
        run: npm run build

  # ─── Publish images ─────────────────────────────────────────────────────────
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `v1.2.3` publishes 1.2.3, 1.2, 1 and latest. A pre-release tag such as
      # `v1.0.0-beta` publishes only the exact version — semver patterns skip
      # pre-releases, and `latest` must never point at one.
      - name: Docker metadata — server
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kuber-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Docker metadata — client
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kuber-client
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: server-runner
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: client-runner
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo
            echo '```'
            echo "${{ steps.meta-server.outputs.tags }}"
            echo "${{ steps.meta-client.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Cut the Release ────────────────────────────────────────────────────────
  # Runs after the images exist, so a Release never advertises a version a
  # Self-hoster cannot pull.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body of the `## [VERSION]` section, stopping at the next
          # `## [` heading. Matching is literal so `1.0.0` cannot select
          # `1.0.0-beta`.
          NOTES=$(awk -v want="## [$VERSION]" '
            index($0, want) == 1 { flag = 1; next }
            /^## \[/            { flag = 0 }
            flag                { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no entry for [$VERSION]. Add one before tagging."
            exit 1
          fi
          {
            echo "body<<KUBER_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "KUBER_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # A tag carrying a pre-release suffix (v1.0.0-beta) is marked as such, so
      # "latest release" on the repository front page stays a stable version.
      - name: Classify the tag
        id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
          draft: false

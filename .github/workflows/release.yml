name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kuber

jobs:
  # ── Quality gate — must pass before any image is built or published ──────────
  quality:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (server)
        run: npm exec --workspace=server -- tsc --noEmit

      - name: Typecheck (client)
        run: npm exec --workspace=client -- tsc --noEmit

      - name: Build all packages
        run: npm run build

      - name: Unit tests (server)
        run: npm run test --workspace=server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kuber:kuber_test@localhost:5432/kuber_test
          JWT_SECRET: test_jwt_secret_at_least_64_characters_long_for_ci_pipeline_run
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_64_characters_long_for_ci_pipeline

  # ── Build & push Docker images ────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # e.g. v1.2.3 → also tag as latest
            echo "SERVER_TAGS=${{ env.IMAGE_PREFIX }}-server:${VERSION},${{ env.IMAGE_PREFIX }}-server:latest" >> $GITHUB_OUTPUT
            echo "CLIENT_TAGS=${{ env.IMAGE_PREFIX }}-client:${VERSION},${{ env.IMAGE_PREFIX }}-client:latest" >> $GITHUB_OUTPUT
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          else
            # master branch push → tag as edge (rolling stable)
            SHORT_SHA="${GITHUB_SHA::8}"
            echo "SERVER_TAGS=${{ env.IMAGE_PREFIX }}-server:edge,${{ env.IMAGE_PREFIX }}-server:master-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "CLIENT_TAGS=${{ env.IMAGE_PREFIX }}-client:edge,${{ env.IMAGE_PREFIX }}-client:master-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "VERSION=edge" >> $GITHUB_OUTPUT
          fi

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.SERVER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.CLIENT_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release (version tags only) ─────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only create a GitHub Release for version tags, not branch pushes
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md 2>/dev/null || echo "")
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}

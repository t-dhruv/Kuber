# Kuber — Production Compose
# Run from the repository root. This file mounts nginx, observability, and
# n8n-workflows config directories that must be present beside it.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin a version:
#   IMAGE_TAG=v1.2.3 docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kuber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuber_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuber -d kuber_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/t-dhruv/kuber-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuber:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/kuber_db
      LOKI_URL: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuber_network
    healthcheck:
      # Uses node (always available in the node:alpine image) — no wget/curl needed
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:9002/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    image: ghcr.io/t-dhruv/kuber-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "9001:80"
    networks:
      - kuber_network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Check that the built index.html exists — nginx starts in <1s so this is sufficient
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - kuber_network
    healthcheck:
      test: ["CMD-SHELL", "nc -zw1 localhost 80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: kuber_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9004:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - kuber_network

  loki:
    image: grafana/loki:latest
    container_name: kuber_loki
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9005:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kuber_network

  promtail:
    image: grafana/promtail:latest
    container_name: kuber_promtail
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - kuber_network

  grafana:
    image: grafana/grafana:latest
    container_name: kuber_grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - kuber_network

  n8n:
    image: n8nio/n8n:latest
    container_name: kuber_n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "9006:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:9006/
      - GENERIC_TIMEZONE=America/Toronto
      - KUBER_WEBHOOK_URL=http://kuber_server:9002
      - KUBER_API_TOKEN=${KUBER_API_TOKEN:-}
      - KUBER_WATCH_TICKERS=${KUBER_WATCH_TICKERS:-}
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    networks:
      - kuber_network

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  n8n_data:

networks:
  kuber_network:
    driver: bridge

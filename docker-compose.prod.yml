version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: kuber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exposed port — internal network only
    networks:
      - kuber_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuber -d kuber_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuber:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/kuber_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuber_network
    # No port exposed externally — nginx proxies to this service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - kuber_network
    # No port exposed externally — nginx proxies to this service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment when TLS certs are configured (see nginx/prod.conf for instructions):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - kuber_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  kuber_network:
    driver: bridge

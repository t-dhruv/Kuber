# Kuber — Production Compose
#
# Three services: Postgres, the server, and the client. The client image
# contains the only nginx and is the edge — it serves the SPA and proxies the
# API, so nothing else needs to sit in front of it. See ADR-0001.
#
# There is no TLS termination here. To expose an Instance beyond a trusted LAN,
# front it with your own reverse proxy or tunnel. For plain-HTTP LAN installs,
# see COOKIE_SECURE in .env.example and ADR-0002.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Pin a version:
#   IMAGE_TAG=v1.2.3 docker compose -f docker-compose.prod.yml up -d
#
# With observability (Prometheus, Loki, Promtail, Grafana):
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kuber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuber_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuber -d kuber_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/t-dhruv/kuber-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kuber:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/kuber_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuber_network
    healthcheck:
      # Uses node (always available in the node:alpine image) — no wget/curl needed
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:9002/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    image: ghcr.io/t-dhruv/kuber-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # The edge. Publishes port 80 directly, where the standalone nginx used to.
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - kuber_network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  kuber_network:
    driver: bridge

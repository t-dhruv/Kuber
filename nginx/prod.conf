# Kuber — Production Nginx Reverse Proxy
# Routes /api/ → Express server, everything else → React SPA (client container)
#
# ─── SSL / HTTPS ──────────────────────────────────────────────────────────────
# To enable HTTPS (strongly recommended):
#
#   1. Obtain TLS certificates (Let's Encrypt via Certbot is easiest):
#        certbot certonly --standalone -d yourdomain.com
#      Certificates land at: /etc/letsencrypt/live/yourdomain.com/
#
#   2. In docker-compose.prod.yml, uncomment the cert volume mount:
#        - /etc/letsencrypt:/etc/letsencrypt:ro
#
#   3. In this file:
#        a. Change server_name _ → server_name yourdomain.com;
#        b. Uncomment the HTTPS server block below
#        c. The HTTP block (port 80) already redirects to HTTPS — no changes needed
#
# ─────────────────────────────────────────────────────────────────────────────

# Enable gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

# ─── HTTP server — redirects to HTTPS when certs are configured ───────────────
server {
    listen 80;
    server_name _;

    # Health check for container orchestration (must be HTTP, not HTTPS)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # When SSL is enabled: redirect all HTTP → HTTPS
    # Uncomment this and comment out the proxy blocks below once you have certs:
    # return 301 https://$host$request_uri;

    # ── Proxy blocks (active when running HTTP-only, no certs yet) ────────────

    # SSE streaming endpoints (AI advisor, budget coach, wealth coach)
    location ~* ^/api/v1/.*/stream$ {
        proxy_pass         http://server:9002;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_buffering        off;
        proxy_cache            off;
        add_header             X-Accel-Buffering no;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # API → Express server
    location /api/ {
        proxy_pass         http://server:9002/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Everything else → React SPA
    location / {
        proxy_pass         http://client:80/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                              always;
    add_header X-Frame-Options         "SAMEORIGIN"                           always;
    add_header X-XSS-Protection        "1; mode=block"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
}


# Kuber — Production Nginx Reverse Proxy
# Routes /api/ → Express server, everything else → React SPA (client container)

# Enable gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 80;
    server_name _;

    # --- API → Express server ---
    location /api/ {
        proxy_pass         http://server:4000/api/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for keep-alive connections
        proxy_set_header   Connection        "";

        # Timeouts suitable for long-running AI advisor requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Everything else → React SPA (served by client container) ---
    location / {
        proxy_pass         http://client:80/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}

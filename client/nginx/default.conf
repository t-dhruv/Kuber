# The client image is the only edge Kuber ships. It serves the built SPA and
# proxies the API to the server, so a deployment needs no separate reverse
# proxy in front of it — see ADR-0001.
#
# TLS is deliberately absent. Self-hosters exposing an Instance beyond a
# trusted LAN are expected to front this with their own proxy or tunnel.

gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css text/javascript application/javascript
                application/json application/xml image/svg+xml font/woff font/woff2;

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Naming the upstream through a variable defers
    # resolution to request time, which buys two things: `nginx -t` can validate
    # this file at image build time, where no `server` host exists to resolve,
    # and the edge survives the server container restarting on a new address.
    # Resolved once at startup, nginx would cache the old address and serve 502s
    # until someone reloaded it by hand.
    resolver        127.0.0.11 ipv6=off valid=10s;
    set $api_server server;

    # Answered by the edge itself rather than proxied, so monitoring can tell
    # "the Instance is not reachable" apart from "the server is unhealthy".
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        include    /etc/nginx/snippets/security-headers.conf;
        return     200 "ok\n";
    }

    # Server-sent events. This regex is matched before the /api/ prefix below,
    # which is what keeps buffering off for streams — nginx would otherwise
    # hold the whole response and the client would receive nothing until the
    # stream closed.
    location ~* ^/api/v1/.*/stream$ {
        proxy_pass         http://$api_server:9002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;
        include            /etc/nginx/snippets/security-headers.conf;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        # No URI part, so the original request URI is passed through unchanged.
        # This was `.../api/` against a `/api/` location — an identity mapping —
        # so the request the server sees is the same as before.
        proxy_pass         http://$api_server:9002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        include    /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

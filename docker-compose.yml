services:
  postgres:
    image: postgres:16-alpine
    container_name: kuber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: kuber_dev
      POSTGRES_DB: kuber_db
    ports:
      - "5433:5432"
    volumes:
      - kuber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuber -d kuber_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuber_network

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runner
    container_name: kuber_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kuber:kuber_dev@postgres:5432/kuber_db
      JWT_SECRET: dev_jwt_secret_change_in_prod
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_prod
      NODE_ENV: production
      CLIENT_URL: http://localhost:9001
      PORT: 9002
      LOKI_URL: http://loki:3100
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuber_network

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-runner
    container_name: kuber_client
    restart: unless-stopped
    ports:
      - "9001:80"
    depends_on:
      - server
    networks:
      - kuber_network

  prometheus:
    image: prom/prometheus:latest
    container_name: kuber_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9004:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kuber_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - kuber_network

  loki:
    image: grafana/loki:latest
    container_name: kuber_loki
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9005:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - kuber_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kuber_network

  promtail:
    image: grafana/promtail:latest
    container_name: kuber_promtail
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - kuber_network

  grafana:
    image: grafana/grafana:latest
    container_name: kuber_grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - kuber_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - kuber_network

volumes:
  kuber_pgdata:
  kuber_prometheus_data:
  kuber_loki_data:
  kuber_grafana_data:

networks:
  kuber_network:

version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: kuber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuber
      POSTGRES_PASSWORD: kuber_dev
      POSTGRES_DB: kuber_db
    ports:
      - "5432:5432"
    volumes:
      - kuber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuber -d kuber_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kuber_net

  server:
    build:
      context: .
      target: server-runner
    container_name: kuber_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kuber:kuber_dev@postgres:5432/kuber_db
      JWT_SECRET: dev_jwt_secret_change_in_prod
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_prod
      NODE_ENV: production
      PORT: 9002
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kuber_net

  client:
    build:
      context: .
      target: client-runner
    container_name: kuber_client
    restart: unless-stopped
    ports:
      - "9001:80"
    depends_on:
      - server

  n8n:
    image: n8nio/n8n:latest
    container_name: kuber_n8n
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Toronto
      - KUBER_WEBHOOK_URL=http://kuber_server:9002
      - KUBER_API_TOKEN=${KUBER_API_TOKEN:-}
      - KUBER_WATCH_TICKERS=${KUBER_WATCH_TICKERS:-}
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows:ro
    networks:
      - kuber_net

volumes:
  kuber_pgdata:
  n8n_data:

networks:
  kuber_net:
